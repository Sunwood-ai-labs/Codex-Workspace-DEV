name: Auto Label Issues

on:
  workflow_dispatch:

# Intentionally inactive until a least-privilege replacement is reviewed.
permissions: {}

jobs:
  automation-paused:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain paused automation
        shell: bash
        run: |
          printf '%s\n' 'This legacy AI automation is paused pending a least-privilege replacement.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'No issue content, credentials, or repository checkout is processed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
